<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ландайский переводчик</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1d1b18;--mu:#7a746b;--ac:#0e7c86;--ac2:#d9f0f2;--bd:#e4dfd6;--wn:#b4541c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1e2326;--tx:#ece8e1;--mu:#99938a;--ac:#4cc3cf;--ac2:#18383c;--bd:#2f3639;--wn:#e8915a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--card:#1e2326;--tx:#ece8e1;--mu:#99938a;--ac:#4cc3cf;--ac2:#18383c;--bd:#2f3639;--wn:#e8915a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.seg{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.seg button{flex:1;padding:10px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;min-height:96px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;resize:vertical}
.out{margin-top:12px;padding:14px;border-radius:12px;background:var(--ac2);font-size:18px;min-height:52px;word-wrap:break-word}
.out small{display:block;margin-top:6px;color:var(--mu);font-size:13px}
.cards{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.c.u{border-style:dashed;border-color:var(--wn)}
.c .s{font-weight:600}.c .t{color:var(--mu);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--bd);background:none;color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{margin-top:16px;color:var(--mu);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Ландайский переводчик</h1>
<div class="seg">
<button id="b1" class="on">Ландайский → Русский</button>
<button id="b2">Русский → Ландайский</button>
</div>
<textarea id="in" placeholder="Например: Etgái liitèn‘hưen xalan clánton" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<div class="out" id="out"><small>Перевод появится здесь</small></div>
<div class="cards" id="cards"></div>
<p class="note">Перевод по словам и правилам: времена, мн. число, повелительное, возвратность, «ả». Слова в рамке пунктиром не найдены или угаданы приблизительно. Нажми на вариант, чтобы выбрать другое значение.</p>
</main>
<script src="dict.js"></script>
<script>
if(typeof D==='undefined'){document.body.innerHTML='<p style="padding:16px">Не найден файл dict.js рядом с index.html</p>';throw new Error('no dict')}
const MAP={'đ':'d','ƀ':'b','ҽ':'e','ɐ':'a','ԏ':'t'};
const norm=s=>{s=s.toLowerCase().replace(/[đƀҽɐԏ]/g,c=>MAP[c]).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
return s.replace(/['’‘ʼ`]/g,'').replace(/\s+/g,' ').trim()};
const L={},R={},X={};const exn=s=>s.toLowerCase().normalize('NFC').replace(/['’‘ʼ`]/g,'').replace(/\s+/g,' ').trim();
D.forEach(([l,r])=>{const xk=exn(l);X[xk]=X[xk]||{r:[]};r.split('/').map(x=>x.trim()).filter(Boolean).forEach(v=>{if(!X[xk].r.includes(v))X[xk].r.push(v)});const k=norm(l);(L[k]=L[k]||{l:l,r:[]});r.split('/').map(x=>x.trim()).filter(Boolean).forEach(v=>{if(!L[k].r.includes(v))L[k].r.push(v);
[v,v.replace(/\s*\(.*?\)\s*/g,'').trim()].forEach(x=>{x=x.toLowerCase();if(!x)return;R[x]=R[x]||[];if(!R[x].includes(l))R[x].push(l)})})});
const SUF=[['hưҽn','текущее'],['hiẹc','будущее'],['hinh','прошедшее'],['đynh','повелит.'],['xão','мн. ч.']];
let dir=1,res=[];
const $=id=>document.getElementById(id);
function parseLd(text){let out=[];text.split(/[.!?]+/).forEach((s,n)=>{const p=parseS(s);const f=p.some(r=>/^(ba )?dan soi$/.test(norm(r.src)));p.forEach(r=>{r.sn=n;if(f)r.fut=1});out=out.concat(p)});return out}
function parseS(text){
const toks=(text.match(/[^\s.,!?;:()«»"]+/g)||[]);const out=[];let i=0;
while(i<toks.length){let found=null;
for(let n=Math.min(4,toks.length-i);n>=1&&!found;n--){
const src=toks.slice(i,i+n).join(' '),k=norm(src);
const ee=X[exn(src)]||L[k];if(ee){found={src,n,opts:ee.r,tag:''};break}
if(n<=2)for(const[s,t]of SUF){if(k.endsWith(s)&&k.length>s.length){const e=L[k.slice(0,-s.length)];if(e){found={src,n,opts:e.r,tag:t};break}}}
if(!found&&n===1&&k==='a'){found={src,n,opts:['(родит. п.: «чего/кого»)'],tag:'',gen:1}}}
if(!found)found={src:toks[i],n:1,opts:[],tag:''};
out.push({src:found.src,opts:found.opts,tag:found.tag,sel:0,gen:found.gen});i+=found.n}
return out}
function parseRu(text){let out=[];text.split(/[.!?]+/).forEach((s,n)=>{const p=parseRS(s);const f=p.some(r=>r.src==='завтра'||r.src==='послезавтра');p.forEach(r=>{r.sn=n;if(f)r.fut=1});out=out.concat(p)});return out}
function parseRS(text){
const toks=(text.toLowerCase().match(/[^\s.,!?;:()«»"]+/g)||[]);const out=[];let i=0;
while(i<toks.length){let f=null;
for(let n=Math.min(3,toks.length-i);n>=1&&!f;n--){const src=toks.slice(i,i+n).join(' ');if(R[src]){f={src,n,opts:R[src],ap:0}}}
if(!f){const w=toks[i];for(let cut=1;cut<=3&&!f;cut++){if(w.length-cut<4)break;const st=w.slice(0,-cut);const key=Object.keys(R).find(k=>k.startsWith(st)&&k.length<=w.length+2);if(key)f={src:w,n:1,opts:R[key],ap:1}}}
if(!f)f={src:toks[i],n:1,opts:[],ap:0};
out.push({src:f.src,opts:f.opts,tag:f.ap?'приблизительно':'',ap:f.ap,sel:0});i+=f.n}
return out}
const PR={'я':0,'ты':1,'он':2,'она':2,'оно':2,'мы':3,'вы':4,'они':5};
const IR={'быть':{p:null,x:'был',i:'будь'},'идти':{p:'иду идёшь идёт идём идёте идут',x:['шёл','шла','шло','шли'],i:'иди'},
'есть':{p:'ем ешь ест едим едите едят',x:'ел',i:'ешь'},'пить':{p:'пью пьёшь пьёт пьём пьёте пьют',x:'пил',i:'пей'},
'хотеть':{p:'хочу хочешь хочет хотим хотите хотят',i:'хоти'},'видеть':{p:'вижу видишь видит видим видите видят',i:'смотри'},
'спать':{p:'сплю спишь спит спим спите спят',x:'спал',i:'спи'},'жить':{p:'живу живёшь живёт живём живёте живут',x:'жил',i:'живи'},
'мыть':{p:'мою моешь моет моем моете моют',i:'мой'},'дышать':{p:'дышу дышишь дышит дышим дышите дышат',i:'дыши'},
'лежать':{p:'лежу лежишь лежит лежим лежите лежат',i:'лежи'},'держать':{p:'держу держишь держит держим держите держат',i:'держи'},
'лететь':{p:'лечу летишь летит летим летите летят',i:'лети'},'ждать':{p:'жду ждёшь ждёт ждём ждёте ждут',x:'ждал',i:'жди'},
'давать':{p:'даю даёшь даёт даём даёте дают',i:'давай'},'занять':{p:'займу займёшь займёт займём займёте займут',i:'займи'},
'начать':{p:'начну начнёшь начнёт начнём начнёте начнут',x:'начал',i:'начни'}};
const IPL={'человек':'люди','ребёнок':'дети','друг':'друзья','дерево':'деревья','звезда':'звёзды','цветок':'цветы','год':'годы','день':'дни','место':'места','дом':'дома','город':'города','глаз':'глаза','имя':'имена'};
const FEM=['ночь','область','дверь','сеть','кладь'];
const QW=['что','где','когда','кто','куда','откуда','почему','зачем','как','чей','сколько'];
const cl=r=>r.opts[r.sel].replace(/\s*\(.*?\)/g,'').trim().toLowerCase();
const isQ=r=>r&&r.opts.length&&!r.gen&&QW.includes(cl(r));
const HU=/[жчшщ]$/,VW=/[аеёиоуыэюя]$/;
const refl=f=>f+(VW.test(f)?'сь':'ся');
function mut(s){if(/ст$/.test(s))return s.slice(0,-2)+'щ';const m={б:'бл',в:'вл',п:'пл',ф:'фл',м:'мл',д:'ж',з:'ж',с:'ш',т:'ч'},c=s.slice(-1);return m[c]?s.slice(0,-1)+m[c]:s}
function pres(b,i){const t=IR[b];if(t)return t.p?t.p.split(' ')[i]:'';
const E=['ю','ешь','ет','ем','ете','ют'];
if(/овать$|евать$/.test(b))return b.slice(0,-5)+'у'+E[i];
if(/[ая]ть$/.test(b))return b.slice(0,-2)+E[i];
if(/(ыть|оть)$/.test(b))return b.slice(0,-3)+'о'+E[i];
if(/уть$/.test(b))return b.slice(0,-3)+'у'+E[i];
if(['иметь','болеть','уметь','владеть'].includes(b))return b.slice(0,-2)+E[i];
if(/(ить|еть)$/.test(b)){const s=b.slice(0,-3);if(i===0){const m=mut(s);return m+(HU.test(m)?'у':'ю')}
return s+['','ишь','ит','им','ите',HU.test(s)?'ат':'ят'][i]}
return b}
function past(b,i,g,r){const t=IR[b],k=i>=3?3:g==='f'?1:g==='n'?2:0;let f;
if(t&&t.x)f=Array.isArray(t.x)?t.x[k]:[t.x,t.x+'а',t.x+'о',t.x+'и'][k];
else{const s=b.slice(0,-2)+'л';f=[s,s+'а',s+'о',s+'и'][k]}
return r?refl(f):f}
function imp(b,pl,r){const t=IR[b];let f=t&&t.i?t.i:pres(b,1).replace(/([аяуоюе])ешь$/,'$1й').replace(/ишь$/,'и');
if(pl)f+='те';return r?refl(f):f}
function plu(w){if(/\s/.test(w))return w;if(IPL[w])return IPL[w];
if(/(ый|ой)$/.test(w))return w.slice(0,-2)+'ые';if(/ий$/.test(w))return w.slice(0,-2)+'ие';if(/ое$/.test(w))return w.slice(0,-2)+'ые';
if(/(ие|ье)$/.test(w))return w.slice(0,-1)+'я';
const c=w.slice(-1),s=w.slice(0,-1);
if(c==='а')return s+(/[гкхжчшщ]$/.test(s)?'и':'ы');
if(c==='я'||c==='ь'||c==='й')return s+'и';if(c==='о')return s+'а';if(c==='е')return s+'я';
return w+(HU.test(w)||/[гкх]$/.test(w)?'и':'ы')}
function gen(w){if(/\s/.test(w))return w;if(w==='день')return 'дня';
if(/(ый|ой|ое)$/.test(w))return w.slice(0,-2)+'ого';if(/ий$/.test(w))return w.slice(0,-2)+'его';
if(/(ие|ье)$/.test(w))return w.slice(0,-1)+'я';if(/ок$/.test(w))return w.slice(0,-2)+'ка';
const c=w.slice(-1),s=w.slice(0,-1);
if(c==='а')return s+(/[гкхжчшщ]$/.test(s)?'и':'ы');if(c==='я')return s+'и';
if(c==='ь')return FEM.includes(w)?s+'и':s+'я';if(c==='й')return s+'я';if(c==='о')return s+'а';if(c==='е')return s+'я';
return w+'а'}
const isV=w=>!/\s/.test(w)&&w!=='сеть'&&(IR[w]||/(ать|ять|еть|ить|ыть|оть|уть|ти|ться|чь)$/.test(w));
function compose(){const g={};res.forEach(r=>(g[r.sn]=g[r.sn]||[]).push(r));const o=Object.values(g).map(composeS);return o.length>1?o.map(s=>/\?$/.test(s)?s:s+'.').join(' '):(o[0]||'')}
function composeS(res){
const rf=res.map((r,k)=>!!(res[k+1]&&res[k+1].opts.length&&!res[k+1].gen&&cl(res[k+1])==='себя'));
let sp=2,sg='m',got=false,seenV=false,nG=false,pV=false,out=[],q=null;
res.forEach((r,k)=>{
if(!r.opts.length){out.push('['+r.src+'?]');return}
if(r.gen){nG=true;return}
const w=cl(r);
if(w==='себя'&&k>0&&rf[k-1])return;
if(k===res.length-1&&isQ(r)&&res.length>1){q=w;return}
if(w==='не'){out.push(w);return}
if(PR[w]!==undefined){sp=PR[w];sg=w==='она'?'f':w==='оно'?'n':'m';got=true;out.push(w);pV=false;return}
if(w==='должен'){out.push(sp>=3?'должны':sg==='f'?'должна':sg==='n'?'должно':'должен');pV=true;return}
if(['нужно','надо','можно','нельзя'].includes(w)){out.push(w);pV=true;return}
if(isV(w)){seenV=true;const t=r.tag||(r.fut&&!pV?'будущее':'');let inf=w;const isR=/ся$/.test(inf)||rf[k];
if(rf[k]&&!/ся$/.test(inf))inf+='ся';
const b=isR?inf.slice(0,-2):inf;let f;
if(pV&&!t)f=inf;
else if(t==='будущее')f=['буду','будешь','будет','будем','будете','будут'][sp]+(b==='быть'?'':' '+inf);
else if(t==='прошедшее')f=past(b,sp,sg,isR);
else if(t==='повелит.'&&(sp===1||sp===4))f=imp(b,sp===4,isR);
else{f=b==='быть'?'':pres(b,sp);if(isR&&f)f=refl(f);if(t==='текущее'&&f)f='сейчас '+f}
out.push(f);pV=true;return}
pV=false;let x=w;
if(r.tag==='мн. ч.')x=plu(x);
if(nG){x=gen(x);nG=false}
if(!got&&!seenV){sp=r.tag==='мн. ч.'?5:2;sg=/[ая]$/.test(w)||FEM.includes(w)?'f':/[ое]$/.test(w)?'n':'m';got=true}
out.push(x)});
let a=out.filter(Boolean);if(q)a.unshift(q);
let s=a.join(' ').replace('вьетнам','Вьетнам');
s=s.charAt(0).toUpperCase()+s.slice(1);return q?s+'?':s}
const isVL=l=>{const e=X[exn(l)];return !!e&&isV((e.r[0]||'').toLowerCase())};
const addP=(l,p)=>l+(/(ch|nh|mh|lh|sh)$/.test(norm(l))?'‘':'')+p;
function render(){
const o=$('out'),c=$('cards');
if(!res.length){o.innerHTML='<small>Перевод появится здесь</small>';c.innerHTML='';return}
const ws=res.map(r=>{if(!r.opts.length)return '['+r.src+'?]';let w=r.opts[r.sel];if(dir===1&&r.tag)w+=' ('+r.tag+')';if(dir===2&&r.fut&&isVL(w))w=addP(w,'hiẹc');return w});
let sent;if(dir===1)sent=compose();else{const a=ws.slice();if(isQ(res[0])&&res.length>1)a.push(a.shift());sent=a.join(' ')}
o.textContent='';const m=document.createElement('div');m.textContent=sent;o.appendChild(m);
if(dir===1){const s=document.createElement('small');s.textContent='по словам: '+ws.join(' ');o.appendChild(s)}
c.innerHTML='';
res.forEach((r,i)=>{const d=document.createElement('div');d.className='c'+((!r.opts.length||r.ap)?' u':'');
const s=document.createElement('div');s.className='s';s.textContent=r.src;d.appendChild(s);
const t=document.createElement('div');t.className='t';
t.textContent=r.opts.length?(r.tag?'форма: '+r.tag:''):'нет в словаре';if(t.textContent)d.appendChild(t);
if(r.opts.length>1){const ch=document.createElement('div');ch.className='chips';
r.opts.forEach((v,j)=>{const b=document.createElement('button');b.className='chip'+(j===r.sel?' on':'');b.textContent=v;b.onclick=()=>{r.sel=j;render()};ch.appendChild(b)});d.appendChild(ch)}
else if(r.opts.length){const m=document.createElement('div');m.textContent='→ '+r.opts[0];d.appendChild(m)}
c.appendChild(d)})}
function run(){const v=$('in').value;res=v.trim()?(dir===1?parseLd(v):parseRu(v)):[];render()}
function setDir(d){dir=d;$('b1').className=d===1?'on':'';$('b2').className=d===2?'on':'';
$('in').placeholder=d===1?'Например: Etgái liitèn‘hưen xalan clánton':'Например: я хочу пить чай';run()}
$('b1').onclick=()=>setDir(1);$('b2').onclick=()=>setDir(2);$('in').oninput=run;
</script>
</body>
</html>
